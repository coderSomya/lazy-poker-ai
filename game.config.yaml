# Lazy Poker AI - Single Config File
# Each player uses its provider's native API key from .env.

players:
  - id: claude-sonnet
    name: "Claude Sonnet 4.5"
    provider: "anthropic"
    model: "claude-sonnet-4-5"
    enabled: true

  - id: gpt-4o
    name: "GPT-4o"
    provider: "openai"
    model: "gpt-4o"
    enabled: true

  - id: gpt-4o-mini
    name: "GPT-4o Mini"
    provider: "openai"
    model: "gpt-4o-mini"
    enabled: true

  - id: mistral-small
    name: "Mistral Small"
    provider: "mistral"
    model: "mistral-small-latest"
    enabled: false

  - id: qwen-plus
    name: "Qwen Plus"
    provider: "qwen"
    model: "qwen-plus"
    enabled: false

  - id: glm-4
    name: "GLM-4"
    provider: "glm"
    model: "glm-4"
    enabled: false

  - id: kimi-k2
    name: "Kimi K2"
    provider: "kimi"
    model: "kimi-k2-0711-preview"
    enabled: false

simulation:
  gamesPerRun: 5
  maxSetsPerGame: 50
  delayBetweenTurnsMs: 500
  maxBidsPerSet: 30

database:
  url: "${DATABASE_URL}"

api:
  port: 3001

web:
  port: 3000
