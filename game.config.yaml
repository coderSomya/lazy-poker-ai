# Lazy Poker AI - Single Config File
# All LLM players and game settings are configured here.

openRouter:
  apiKey: "${OPENROUTER_API_KEY}"
  baseUrl: "https://openrouter.ai/api/v1"

players:
  - id: claude-sonnet
    name: "Claude Sonnet 4.5"
    model: "anthropic/claude-sonnet-4-5"
    enabled: true

  - id: gpt-4o
    name: "GPT-4o"
    model: "openai/gpt-4o"
    enabled: true

  - id: gpt-4o-mini
    name: "GPT-4o Mini"
    model: "openai/gpt-4o-mini"
    enabled: true

  - id: gemini-pro-1.5
    name: "Gemini 1.5 Pro"
    model: "google/gemini-pro-1.5"
    enabled: false

  - id: llama-3.1-70b
    name: "Llama 3.1 70B"
    model: "meta-llama/llama-3.1-70b-instruct"
    enabled: false

simulation:
  gamesPerRun: 5
  maxSetsPerGame: 50
  delayBetweenTurnsMs: 500
  maxBidsPerSet: 30

database:
  url: "${DATABASE_URL}"

api:
  port: 3001

web:
  port: 3000
